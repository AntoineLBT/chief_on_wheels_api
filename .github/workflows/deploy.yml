name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

# Queue deploys instead of running two at once; never cancel a migration.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/antoinelbt/chief_on_wheels_api # GHCR names must be lowercase

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chief
          POSTGRES_PASSWORD: chief
          POSTGRES_DB: chief
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chief -d chief"
          --health-interval 5s
          --health-retries 10
    env:
      POSTGRES_USER: chief
      POSTGRES_PASSWORD: chief
      POSTGRES_DB: chief
      POSTGRES_HOST: localhost
      env: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install tox
      - run: tox -e flake8,test
      # Locally, tox -e black / isort reformat; in CI they only check.
      - run: tox -e black,isort -- --check

  build:
    needs: test
    runs-on: ubuntu-24.04-arm # native arm64, like the CAX11
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Skipped until the server exists (repository variable DEPLOY_SSH_HOST).
    if: vars.DEPLOY_SSH_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          HOST: ${{ vars.DEPLOY_SSH_HOST }}
        # The new tag is exported for this run only and written to .env last:
        # if pull or migrate fails, .env still points to the running image.
        run: |
          ssh "deploy@$HOST" bash -s -- "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          cd /opt/chief_on_wheels
          export API_TAG="$1"
          docker compose pull api
          docker compose run --rm api python manage.py migrate --no-input
          docker compose up -d api
          sed -i "s/^API_TAG=.*/API_TAG=$API_TAG/" .env
          docker image prune -f
          EOF
